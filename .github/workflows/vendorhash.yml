# Dependabot bumps go.mod/go.sum but can't update flake.nix's vendorHash; this recomputes it
# and pushes the fix to the Dependabot branch. Humans changing go.mod: `just build` (or `just check`) does the same.
name: vendorhash

on:
  pull_request:
    paths: [go.mod, go.sum]

permissions:
  contents: read

concurrency:
  group: vendorhash-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  compute:
    # Branch, not PR author: also runs after "Update branch"/rebase by a human, when go.sum changes again.
    if: startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      sha: ${{ steps.hash.outputs.sha }}
    steps:
      # Runs the branch's justfile and flake, so no credentials here; the push job runs none of its code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: recompute vendorHash
        id: hash
        run: |
          nix run --inputs-from . nixpkgs#just -- vendorhash # same recipe `just build` runs locally
          if git diff --quiet flake.nix; then echo "vendorHash is current (other build errors are ci.yml's nix job's to report)"; exit 0; fi
          nix build .#default.goModules --no-link # fail loudly if the new hash still doesn't match
          echo "hash=$(sed -n 's/.*vendorHash = "\([^"]*\)".*/\1/p' flake.nix)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  push:
    needs: compute
    if: needs.compute.outputs.hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the token never shares a job with branch files; flake.nix is edited through the contents API.
      # A PAT, not GITHUB_TOKEN: commits made with GITHUB_TOKEN don't trigger ci.yml.
      # DEPENDABOT_PUSH_TOKEN (fine-grained PAT, contents: write, this repo) must exist as BOTH a Dependabot
      # secret (runs triggered by Dependabot) and an Actions secret (runs triggered by a human updating the branch).
      - name: commit vendorHash
        # The hash is checked, since branch code produced it.
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HASH: ${{ needs.compute.outputs.hash }}
          SHA: ${{ needs.compute.outputs.sha }}
        run: |
          [[ $HASH =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]] || { echo "unexpected vendorHash: $HASH" >&2; exit 1; }
          if [ "$(gh api "repos/$REPO/branches/$BRANCH" -q .commit.sha)" != "$SHA" ]; then echo "branch moved since the hash was computed; its own run updates it"; exit 0; fi
          gh api "repos/$REPO/contents/flake.nix?ref=$SHA" > file.json
          jq -r .content file.json | base64 -d | sed "s|vendorHash = \"[^\"]*\"|vendorHash = \"$HASH\"|" > flake.nix
          # sha: the API refuses the commit if flake.nix changed on the branch meanwhile.
          gh api -X PUT "repos/$REPO/contents/flake.nix" -f branch="$BRANCH" -f sha="$(jq -r .sha file.json)" \
            -f message="fix(flake): update vendorHash" -f content="$(base64 -w0 flake.nix)" \
            -f 'committer[name]=github-actions[bot]' -f 'committer[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -q .commit.sha
